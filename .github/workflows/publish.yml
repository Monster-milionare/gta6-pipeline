name: Publicar proximo item aprovado

on:
  schedule:
    # espacado ao longo do dia (UTC) - cada disparo roda publish.py --all,
    # que processa TUDO que ainda falta publicar no dia (nao so 1 item) -
    # isso existe pra sobreviver ao cron do GitHub Actions nao ser
    # confiavel (execucoes atrasadas ou nem disparando nesse dia). Varios
    # horarios aqui so dao mais chances de pelo menos 1 disparar no dia.
    - cron: "0 12 * * *"  # 09:00 America/Sao_Paulo
    - cron: "0 14 * * *"  # 11:00
    - cron: "0 16 * * *"  # 13:00
    - cron: "0 18 * * *"  # 15:00
    - cron: "0 20 * * *"  # 17:00
    - cron: "0 22 * * *"  # 19:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Confirmar ffmpeg disponivel
        run: ffmpeg -version

      - name: Gerar mascote e trilha sonora (assets sintetizados em runtime)
        run: |
          python assets/mascote/gerar_mascote.py
          python assets/musica/gerar_musica.py

      - name: Baixar screenshots oficiais de GTA VI (broll real)
        run: python assets/broll_oficial/baixar_broll.py

      - name: Aguardar jitter aleatorio (so em execucoes agendadas)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 1200))

      - name: Restaurar credenciais do YouTube
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json

      - name: Publicar tudo que falta hoje (catch-up, ver publish.py)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python publish.py --all

      - name: Salvar status de publicado no repositorio
        run: |
          git config user.name "gta6-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add review/
          git diff --cached --quiet || git commit -m "chore: item publicado $(date +%F_%H:%M)"
          # O video ja foi publicado no YouTube nesse ponto - o que falta
          # e so salvar "Publicado: sim" no repo. Se outro push (manual ou
          # de outra execucao concorrente) mudou o main nesse meio tempo,
          # um "git push" direto falha com rejected/non-fast-forward e
          # essa marcacao se perde, arriscando publicar o MESMO item de
          # novo no proximo ciclo. Por isso, se falhar, rebase em cima do
          # que tem de novo no remoto e tenta de novo (poucas vezes,
          # sempre com um commit so nosso, entao o rebase e seguro).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "[publish] status salvo no repositorio."
              break
            fi
            echo "[publish] push rejeitado (tentativa $i/5) - rebase e tenta de novo"
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
