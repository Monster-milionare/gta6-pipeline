name: Publicar proximo item aprovado

on:
  schedule:
    # O cron do GitHub Actions atrasa horas (ou nem dispara) quando marcado
    # em minuto cheio (:00), que e o horario de pico deles. Por isso aqui e
    # sempre minuto "quebrado" (:23/:47) e varios horarios ao longo do dia:
    # QUALQUER um que disparar resolve o dia inteiro sozinho (gera o lote
    # se ainda nao existir + sobe tudo com horario agendado no proprio
    # YouTube - ver publish.py). Os outros disparos do dia so conferem que
    # nao ha nada pendente e terminam em segundos.
    - cron: "23 9 * * *"
    - cron: "47 10 * * *"
    - cron: "11 11 * * *"
    - cron: "23 12 * * *"
    - cron: "47 13 * * *"
    - cron: "29 14 * * *"
    - cron: "23 15 * * *"
    - cron: "53 16 * * *"
    - cron: "47 17 * * *"
    - cron: "41 19 * * *"
    - cron: "23 21 * * *"
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      tentativa:
        description: "uso interno: numero da re-execucao automatica"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

# Nunca duas publicacoes ao mesmo tempo (duas execucoes juntas subiriam o
# mesmo video duas vezes). Uma segunda execucao espera a primeira acabar.
concurrency:
  group: gta6-pipeline-publicacao
  cancel-in-progress: false

# "Hoje" e sempre o dia em Brasilia (vale pro "date" do shell e pro Python).
env:
  TZ: America/Sao_Paulo

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Checar se ha algo pendente hoje (evita gastar minutos a toa)
        id: checar
        run: |
          HOJE=$(date +%F)
          ARQ="review/$HOJE.md"
          if [ ! -f "$ARQ" ]; then
            echo "[checar] lote de $HOJE ainda nao existe - vai gerar e publicar."
            echo "pendente=true" >> "$GITHUB_OUTPUT"
          elif grep -q "^Status: APROVADO" "$ARQ" && grep -q "^Publicado: nao" "$ARQ"; then
            echo "[checar] ha itens pendentes em $ARQ."
            echo "pendente=true" >> "$GITHUB_OUTPUT"
          else
            echo "[checar] nada pendente em $HOJE - encerrando."
            echo "pendente=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.checar.outputs.pendente == 'true'
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        if: steps.checar.outputs.pendente == 'true'
        run: pip install -r requirements.txt

      - name: Garantir lote de hoje (gera aqui se o cron de geracao nao rodou)
        if: steps.checar.outputs.pendente == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          HOJE=$(date +%F)
          if [ ! -f "review/$HOJE.md" ]; then
            # a API gratis de roteiro as vezes falha: tenta ate 4 vezes
            for t in 1 2 3 4; do
              python generate.py && break
              echo "[generate] tentativa $t falhou - aguardando antes de tentar de novo"
              sleep $((t * 40))
            done
            if [ ! -f "review/$HOJE.md" ]; then
              echo "::error::nao foi possivel gerar o lote de hoje"
              exit 1
            fi
            git config user.name "gta6-pipeline-bot"
            git config user.email "actions@users.noreply.github.com"
            git add review/
            git diff --cached --quiet || git commit -m "chore: lote gerado $HOJE"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              git pull --rebase --autostash origin main
              sleep 5
            done
          fi

      - name: Instalar ffmpeg e fontes
        if: steps.checar.outputs.pendente == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Gerar mascote e trilha sonora (assets sintetizados em runtime)
        if: steps.checar.outputs.pendente == 'true'
        run: |
          python assets/mascote/gerar_mascote.py
          python assets/musica/gerar_musica.py

      - name: Baixar screenshots oficiais de GTA VI (broll real)
        if: steps.checar.outputs.pendente == 'true'
        run: python assets/broll_oficial/baixar_broll.py

      - name: Restaurar clipes oficiais em cache
        if: steps.checar.outputs.pendente == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/clipes_oficiais/*.mp4
            assets/clipes_oficiais/_tentados.txt
          key: clipes-oficiais-v1-${{ github.run_id }}
          restore-keys: |
            clipes-oficiais-v1-

      - name: Preparar clipes oficiais de video (site de midia da Rockstar)
        id: clipes
        if: steps.checar.outputs.pendente == 'true'
        env:
          CLIPES_ORCAMENTO_SEG: "600"
        run: python assets/clipes_oficiais/baixar_clipes.py

      - name: Guardar clipes em cache
        if: steps.checar.outputs.pendente == 'true' && steps.clipes.outputs.novos == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            assets/clipes_oficiais/*.mp4
            assets/clipes_oficiais/_tentados.txt
          key: clipes-oficiais-v1-${{ github.run_id }}

      - name: Restaurar credenciais do YouTube
        if: steps.checar.outputs.pendente == 'true'
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json

      - name: Publicar tudo que falta hoje (ver publish.py)
        id: pub
        if: steps.checar.outputs.pendente == 'true'
        continue-on-error: true
        timeout-minutes: 180
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          python publish.py --all
          code=$?
          echo "codigo=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Salvar status de publicado no repositorio (rede de seguranca)
        if: always() && steps.checar.outputs.pendente == 'true'
        run: |
          # publish.py ja salva o status apos CADA item; isto aqui so cobre
          # o caso de algum push de la ter falhado.
          git config user.name "gta6-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add review/
          git diff --cached --quiet || git commit -m "chore: status de publicacao $(date +%F_%H:%M)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "[publish] status salvo no repositorio."
              break
            fi
            echo "[publish] push rejeitado (tentativa $i/5) - rebase e tenta de novo"
            git pull --rebase --autostash origin main
            sleep 5
          done

      - name: Sobrou item? Se sim, dispara nova execucao sozinha
        if: always() && steps.pub.outputs.codigo == '1' && fromJSON(github.event.inputs.tentativa || '0') < 5
        env:
          GH_TOKEN: ${{ github.token }}
          TENTATIVA: ${{ github.event.inputs.tentativa || '0' }}
        run: |
          # codigo 1 = algum item falhou (render, voz, upload...). Em vez de
          # esperar o proximo horario do cron (que o GitHub atrasa), pede uma
          # nova execucao agora; ela entra na fila e roda quando esta acabar.
          sleep 120
          gh workflow run publish.yml -f tentativa=$((TENTATIVA + 1))

      - name: Deixar a execucao vermelha se algo falhou (aparece na aba Actions)
        if: always() && steps.pub.outputs.codigo != '' && steps.pub.outputs.codigo != '0'
        run: exit 1
