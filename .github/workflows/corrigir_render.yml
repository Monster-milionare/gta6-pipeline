name: Corrigir render do longo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar o conserto do recorte (render.py)
        run: |
          python3 - <<'EOF'
          p = "render.py"
          t = open(p, encoding="utf-8").read()
          a = "        p = self.n_plano / max(1, self.frames_plano - 1)\n"
          b = "        p = min(1.0, max(0.0, self.n_plano / max(1, self.frames_plano - 1)))\n"
          assert t.count(a) == 1, "linha p nao encontrada"
          t = t.replace(a, b)
          c = "        return img.resize((self.w, self.h), Image.BILINEAR, box=(cx, cy, cx + cw, cy + ch))\n"
          d = ("        cx = min(max(0.0, cx), max(0.0, img.width - cw))\n"
               "        cy = min(max(0.0, cy), max(0.0, img.height - ch))\n"
               "        cw, ch = min(cw, img.width - cx), min(ch, img.height - cy)\n"
               "        return img.resize((self.w, self.h), Image.BILINEAR, box=(cx, cy, cx + cw, cy + ch))\n")
          assert t.count(c) == 1, "linha resize nao encontrada"
          t = t.replace(c, d)
          open(p, "w", encoding="utf-8").write(t)
          print("render.py corrigido")
          EOF
          python3 -m py_compile render.py
          git config user.name "setup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add render.py
          git commit -m "fix: recorte da foto no motor novo estourava no video longo (caia no motor classico)"
          git push
