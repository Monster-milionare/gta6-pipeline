name: Preview da edicao (nao publica)

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TZ: America/Sao_Paulo

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Instalar ffmpeg e fontes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Restaurar clipes oficiais em cache
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/clipes_oficiais/*.mp4
            assets/clipes_oficiais/_tentados.txt
          key: clipes-oficiais-v1-${{ github.run_id }}
          restore-keys: |
            clipes-oficiais-v1-

      - name: Preparar clipes oficiais de video (site de midia da Rockstar)
        id: clipes
        env:
          CLIPES_ORCAMENTO_SEG: "1200"
        run: python assets/clipes_oficiais/baixar_clipes.py

      - name: Guardar clipes em cache
        if: steps.clipes.outputs.novos == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            assets/clipes_oficiais/*.mp4
            assets/clipes_oficiais/_tentados.txt
          key: clipes-oficiais-v1-${{ github.run_id }}

      - name: Gerar mascote classico, trilha e prints oficiais
        run: |
          python assets/mascote/gerar_mascote.py
          python assets/musica/gerar_musica.py
          python assets/broll_oficial/baixar_broll.py

      - name: Renderizar videos de teste
        run: |
          python preview.py short
          python preview.py long

      - name: Guardar videos de teste pra baixar (aba Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: preview-videos
          path: assets/tmp/preview_*.mp4
          retention-days: 5

      - name: Salvar folhas de quadros em preview/
        if: always()
        run: |
          git config user.name "gta6-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f preview/
          git diff --cached --quiet || git commit -m "chore: preview da edicao $(date +%F_%H:%M)"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            git pull --rebase --autostash origin main
            sleep 5
          done
