name: Gerar lote diario

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 06:00 em America/Sao_Paulo (UTC-3)
  workflow_dispatch: {}    # tambem da pra disparar manualmente na aba Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Gerar roteiros do dia
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python generate.py

      - name: Salvar review/*.md no repositorio
        run: |
          git config user.name "gta6-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add review/
          git diff --cached --quiet || git commit -m "chore: lote gerado $(date +%F)"
          git push
